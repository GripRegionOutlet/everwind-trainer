[project]
name = "everwind-trainer"
version = "2026.4.1"
description = "Everwind Trainer — pipeline-based memory trainer for Everwind (single-player & LAN)"
authors = [{name = "everwind-trainer maintainers", email = "maint@everwind-trainer.dev"}]
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
everwind-trainer = "src.main:cli_entry"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]